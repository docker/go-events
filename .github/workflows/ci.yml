name: ci

# Default to 'contents: read', which grants actions to read commits.
#
# If any permission is set, any permission not included in the list is
# implicitly set to "none".
#
# see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:

env:
  DESTDIR: ./build

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "oldstable" 
          cache: false
      - name: Create go.mod
        run: |
          ln -s vendor.mod go.mod
          ln -s vendor.sum go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          skip-cache: true

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    strategy:
      matrix:
        go: ["1.13", "oldstable", "stable"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Create go.mod
        run: |
          ln -s vendor.mod go.mod
          ln -s vendor.sum go.sum
      - name: Run tests
        run: go test -race
  
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      # required to write sarif report
      security-events: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Create go.mod
        run: |
          ln -s vendor.mod go.mod
          ln -s vendor.sum go.sum
      - name: Create artifact directory
        run: mkdir -p ${{ env.DESTDIR }}
      - name: Run govulncheck
        # temporarily using "master" until https://github.com/golang/govulncheck-action/commit/31f7c5463448f83528bd771c2d978d940080c9fd is in a release
        uses: golang/govulncheck-action@31f7c5463448f83528bd771c2d978d940080c9fd # master
        with:
          go-package: ./...
          check-latest: true
          repo-checkout: false
          output-format: 'sarif'
          output-file: ${{ env.DESTDIR }}/govulncheck.out
      - name: Upload SARIF report
        if: ${{ github.event_name != 'pull_request' && github.repository == 'docker/go-events' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        with:
          sarif_file: ${{ env.DESTDIR }}/govulncheck.out 
